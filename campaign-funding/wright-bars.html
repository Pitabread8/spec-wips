<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wright Legal Entities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface: #ffffff;
    --ink: #1d1d1f;
    --ink-2: #55555c;
    --rule: #deded9;
    --axis: #a9a9a3;
    --wright: #1baf7a;
    --highlight: #d1332e;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font: 16px/1.45 Roboto, sans-serif;
  }
  h1 { margin: 0 0 6px; font-size: clamp(22px, 5vw, 30px); line-height: 1.2; text-wrap: balance; }
  .subtitle { margin: 0; color: var(--ink-2); }

  /* The scroller's height is set in the script: one screen, plus the sideways travel, plus a pause for each text card. */
  #pin {
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
  }
  header { padding: 24px 16px 12px; }
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #track { position: absolute; top: 0; left: 0; display: block; will-change: transform; }
  #axis { position: absolute; top: 0; left: 0; display: block; background: var(--surface); }

  .grid line { stroke: var(--rule); }
  .baseline { stroke: var(--axis); }
  .axis text { fill: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .axis path, .axis line { display: none; }
  .bar { fill: var(--wright); }
  .value { fill: var(--ink); font-size: 14px; font-weight: 600; text-anchor: middle; font-variant-numeric: tabular-nums; }
  .name { fill: var(--ink-2); font-size: 12px; text-anchor: middle; }
  .column { transition: opacity 200ms ease; }
  .column .bar { transition: fill 200ms ease; }
  .column.dim { opacity: 0.3; }
  .column.focus .bar { fill: var(--highlight); }

  /* Cards sit to the right of the chart on wide screens and across its top on narrow ones. CARD_SIDE_MIN in the script must match. */
  #cards { position: absolute; top: 16px; right: 24px; z-index: 2; width: 340px; pointer-events: none; }
  .card {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 16px 18px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    font-size: 15px;
    line-height: 1.5;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 250ms ease, transform 250ms ease;
  }
  .card.active { opacity: 1; transform: none; }
  .card p { margin: 0; }
  @media (max-width: 759px) {
    #cards { top: 8px; left: 16px; right: 16px; width: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    .column, .column .bar, .card { transition: none; }
  }
  @media (forced-colors: active) {
    .bar { fill: CanvasText; }
    .column.focus .bar { fill: Highlight; }
    .card { border-color: CanvasText; }
  }
</style>
</head>
<body>
<div id="scroller">
  <div id="pin">
    <header>
      <h1>Wright is funded by 68 unique legal entities, constituting roughly a third of his total campaign funding.</h1>
      <p class="subtitle" id="subtitle">These entities include unions, political committees, and corporations.</p>
    </header>
    <div id="stage">
      <svg id="track"></svg>
      <svg id="axis" aria-hidden="true"></svg>
      <div id="cards" aria-live="polite"></div>
    </div>
  </div>
</div>

<script>
  // Copy of Campaign Funding - wright entities.csv, inlined so the page also works when opened directly from disk.
  const CSV = `Contributor Name,SUM of Amount,Contributor Name Cleaned
1199 SEIU-NYS Political Action Fund,"$3,000.00",1199 SEIU-NYS Political Action Fund
32BJ United ADF,"$3,000.00",32BJ United American Dream Fund
40 ACRES PAC,$500.00,40 Acres PAC
65 SPRING PEALTY LLC,"$2,500.00",65 Spring Realty LLC
BRICKLAYERS&ALLIED CRAFTWORKERS LOCAL 1,$500.00,Bricklayers and Allied Craftworkers Local 1
BW PAC,"$2,350.00",Brown & Weinraub PAC
CARTHAGE REAL ESTATE ADVISORS LLC,$250.00,Carthage Real Estate Advisors LLC
CHARTER COMMUNICATIONS PAC,"$1,000.00",Charter Communications PAC
CONVENIENCE,$250.00,Convenience PAC
CORDO & COMPANY LLC PAC,$300.00,Cordo & Company LLC PAC
COZEN O'CONNER PAC,"$1,500.00",Cozen O'Connor PAC
Cse Political Action Fund,"$3,000.00",Civil Service Employees Political Action Fund
Cwa District One Pac,$500.00,Communications Workers of America District 1 PAC
DAVIDOFF HUTCHER CITRON LLP,"$1,000.00","Davidoff, Hutcher & Citron LLP"
DEMOCRATS FOR EDUCATION REFORM,"$2,500.00",Democrats for Education Reform
DISTRICT COUNCIL 37 PAC,"$2,500.00",District Council 37 PAC
FEATHERSTONHAUGH CLYNE MCCARDLE LLP,$500.00,"Featherstonhaugh, Wiley & Clyne LLP"
Friends Of Michaelle Solages,"$1,000.00",Friends Of Michaelle Solages
GAI PAC,"$2,500.00",GAI PAC
"GP CONSTRUCTION, LLC","$6,000.00",GP Construction LLC
GREAT PUBLIC SCHOOL PAC,"$2,000.00",Great Public Schools PAC
Greater Ny Auto Dealers Assoc Inc Pac,$250.00,Greater New York Automobile Dealers Association Inc. PAC
GREENBERG TRAURIG PA PAC,"$1,000.00",Greenberg Traurig P.A. PAC
HANYC PAC,"$3,000.00",Hotel Association of New York City PAC
HOME HEALTHCARE WORKERS OF AMERICA PA,"$3,000.00",Home Healthcare Workers of America PAC
HOSPITAL ALLIANCE PAC,$500.00,Hospital Alliance PAC
Ibew Ny Pac,$250.00,International Brotherhood of Electrical Workers New York PAC
INTERNATL UNION OF JOURNEYMEN&ALLIED TRA,"$1,031.00",International Union of Journeymen and Allied Trades
IUOE Local 30 State PAC,$250.00,International Union of Operating Engineers Local 30 State PAC
JPMORGAN CHASE&CO PAC,"$1,250.00",JPMorgan Chase & Co. PAC
"JUST LORRAINES PLACE TWO, LLC","$1,000.00",Just Lorraines Place Two LLC
LATOYA JOYNER FOR ASSEMBLY ELECTION COMM,$375.00,Latoya Joyner For Assembly Election Committee
LAWPAC of New York,"$2,000.00",LawPAC of New York
Leadingage New York Pac,$600.00,LeadingAge New York PAC
Local 6 Committee On Political Education,"$3,000.00",Local 6 Committee on Political Education
MADISON SQ GARDEN NY PAC,"$3,000.00",Madison Square Garden New York PAC
MANATTMPHELPS&PHILLIPS LLC,$250.00,"Manatt, Phelps & Phillips LLP"
MANHATTAN BEER DISTRIBUTION LLC NYS PAC,"$3,500.00",Manhattan Beer Distribution LLC New York State PAC
New York Bankers Pac,$500.00,New York Bankers PAC
NEW YORK LEAGUE OF CONSERVATION VOTERS,$252.68,New York League Of Conservation Voters
NEW YORK THOROUGHBRED HORSEMENS ASSOC,$250.00,New York Thoroughbred Horsemen's Association
NEW YORK WORKING FAMILY,"$1,500.00",New York Working Family's Party
NEW YORKERS FOR LOCALBUSINESSES PAC,"$1,500.00",New Yorkers for Local Businesses PAC
NORTHEAST DAIRY PRODUCERS ASSOC PAC,$250.00,Northeast Dairy Producers Association PAC
NY APARTMENT ASSOC PAC,"$1,000.00",New York Apartment Association PAC
NYLCV GIVES GREEN,$250.00,NYLCV Gives Green
Nys Afl-Cio Cope Account,"$3,000.00",New York State AFL-CIO Committee on Political Education
NYSCORRECTIONALOFFICERS&POLICE PAC,$500.00,New York State Correctional Officers and Police Benevolent Association Inc. PAC
NYSSCOA PAC,$500.00,New York State Supreme Court Officers Association PAC
People for Diaz,$250.00,People for Diaz
pfizer pac,$500.00,Pfizer PAC
POST NY A LLIANCE PAC FUND,$250.00,Post New York Alliance PAC Fund
Public Employees Federation,$500.00,Public Employees Federation
Real Estate Board Pac,"$1,000.00",Real Estate Board PAC
Soa Of Ny,$250.00,Standardbred Owners Association of New York
SOCIALSERVICES EMPLOY UNION 371,$500.00,Social Service Employees Union Local 371
Solidarity PAC Inc.,"$3,000.00",Solidarity PAC Inc.
Speaker Heastie Pac,"$3,000.00",Speaker Heastie PAC
Stand Up PAC,"$3,000.00",Stand Up PAC
STATE STREET ASSOC PAC,"$2,000.00",State Street Associates PAC
Studio Mechanics Local-52-PAC,$250.00,Studio Mechanics Local 52 PAC
THE BUSINESS COUNCIL PAC INC,$531.00,The Business Council PAC Inc.
The Elk Street Group Llc,$250.00,The Elk Street Group LLC
Theatrical Teamsters Local 817 Pac Fund,$500.00,Theatrical Teamsters Local 817 PAC Fund
Transport Workers Union Local 100,"$7,000.00",Transport Workers Union Local 100
UNITED SERVICE WORKERS UNION,"$1,500.00",United Service Workers Union
VOICE OF TEACHERS FOR EDUCATION,"$4,000.00",Voice of Teachers for Education
YUSEF SALAAM 2025,$10.00,Yusef Salaam 2025
Grand Total,"$98,699.68",`;

  const PITCH = 112;
  const BAR_WIDTH = 64;
  const NAME_WIDTH = 100;
  const LINE_HEIGHT = 15;
  const MAX_NAME_LINES = 7;
  const MIN_STAGE_HEIGHT = 320;
  const CARD_SIDE_MIN = 760; // At this stage width and up, cards sit beside the chart instead of over it.
  const CARD_SPACE = 340 + 24 + 16; // Card width, its right inset, and a gap before the highlighted columns.
  const HOLD = 0.8; // Scrolling past one card takes this many screen heights.
  const MIN_PAN = 0.3; // Moving between stops takes at least this many screen heights, even when the chart barely moves.
  const margin = { top: 28, right: 24, bottom: 16 + MAX_NAME_LINES * LINE_HEIGHT, left: 56 };

  const parseMoney = s => parseFloat(s.replace(/[$,]/g, ""));
  const money = d3.format("$,.0f");
  const axisMoney = v => d3.format("$,.0f")(v);

  const parsed = d3.csvParse(CSV);
  const [nameColumn, amountColumn, cleanedColumn] = parsed.columns;
  const entities = d3.sort(
    parsed.filter(d => d[nameColumn] !== "Grand Total").map(d => ({ name: d[cleanedColumn], amount: parseMoney(d[amountColumn]) })),
    (a, b) => d3.descending(a.amount, b.amount) || d3.ascending(a.name.toLowerCase(), b.name.toLowerCase())
  );
  const total = d3.sum(entities, d => d.amount);

  // The chart pauses at each stop and shows its cards one at a time. Highlighted names must match the cleaned names in the CSV.
  // A stop with no highlighted names pauses partway between its neighbors.
  const STOPS = [
    {
      highlight: ["Transport Workers Union Local 100", "GP Construction LLC", "Voice of Teachers for Education"],
      cards: [
        "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.",
        "Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat."
      ]
    },
    {
      highlight: ["GP Construction LLC"],
      cards: [
        "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.",
        "Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum."
      ]
    },
    {
      highlight: [],
      cards: [
        "Curabitur pretium tincidunt lacus. Nulla gravida orci a odio. Nullam varius, turpis et commodo pharetra, est eros bibendum elit, nec luctus magna felis sollicitudin mauris."
      ]
    },
    {
      highlight: ["Stand Up PAC"],
      cards: [
        "Integer in mauris eu nibh euismod gravida. Duis ac tellus et risus vulputate vehicula."
      ]
    },
    {
      highlight: ["Speaker Heastie PAC", "Solidarity PAC Inc."],
      cards: [
        "Donec lobortis risus a elit. Etiam tempor. Ut ullamcorper, ligula eu tempor congue, eros est euismod turpis, id tincidunt sapien risus a quam."
      ]
    },
    {
      highlight: ["Solidarity PAC Inc."],
      cards: [
        "Maecenas fermentum consequat mi. Donec fermentum. Pellentesque malesuada nulla a mi.",
        "Duis sapien sem, aliquet nec, commodo eget, consequat quis, neque. Aliquam faucibus, elit ut dictum aliquet, felis nisl adipiscing sapien.",
        "Sed malesuada diam in lectus. Mauris ac risus eget leo cursus lacinia. Vivamus sed est a urna convallis varius.",
        "Phasellus viverra nulla ut metus varius laoreet. Quisque rutrum. Aenean imperdiet. Etiam ultricies nisi vel augue."
      ]
    }
  ];

  STOPS.forEach(stop => {
    stop.columns = stop.highlight.map(name => {
      const index = entities.findIndex(d => d.name === name);
      if (index < 0) console.warn(`Stop highlights "${name}", which is not in the data.`);
      return index;
    }).filter(index => index >= 0);
  });

  const scroller = document.getElementById("scroller");
  const pin = document.getElementById("pin");
  const stage = document.getElementById("stage");
  const track = d3.select("#track");
  const axis = d3.select("#axis");
  let travel = 0;
  let columns = d3.select(null);
  let timeline = [];
  let shown = null;

  const cards = d3.select("#cards").selectAll(".card")
    .data(STOPS.flatMap((stop, stopIndex) => stop.cards.map((text, cardIndex) => ({ stopIndex, cardIndex, text }))))
    .join("div")
    .attr("class", "card");
  cards.append("p").text(d => d.text);

  function roundedTop(x, width, top, bottom) {
    const r = Math.min(4, bottom - top);
    return `M${x},${bottom}V${top + r}Q${x},${top} ${x + r},${top}H${x + width - r}Q${x + width},${top} ${x + width},${top + r}V${bottom}Z`;
  }

  // Wraps a name onto lines under its column. A single word wider than the column breaks mid-word.
  function wrapName(node, name) {
    const label = d3.select(node);
    const fits = text => {
      label.text(text);
      return node.getComputedTextLength() <= NAME_WIDTH;
    };
    const lines = [];
    let line = "";
    name.split(/\s+/).forEach(word => {
      if (fits(line ? `${line} ${word}` : word)) {
        line = line ? `${line} ${word}` : word;
        return;
      }
      if (line) lines.push(line);
      line = "";
      for (const char of word) {
        if (line && !fits(line + char)) {
          lines.push(line);
          line = char;
        } else {
          line += char;
        }
      }
    });
    if (line) lines.push(line);

    label.text("");
    lines.slice(0, MAX_NAME_LINES).forEach((text, i) => {
      label.append("tspan")
        .attr("x", 0)
        .attr("dy", i ? LINE_HEIGHT : 0)
        .text(text);
    });
  }

  function draw() {
    const stageWidth = stage.clientWidth;
    const height = Math.max(stage.clientHeight, MIN_STAGE_HEIGHT);
    const width = margin.left + entities.length * PITCH + margin.right;
    const baseline = height - margin.bottom;
    const y = d3.scaleLinear()
      .domain([0, d3.max(entities, d => d.amount)])
      .nice()
      .range([baseline, margin.top]);

    track.selectAll("*").remove();
    track.attr("width", width).attr("height", height)
      .attr("role", "img")
      .attr("aria-label", `Column chart of donations from ${entities.length} legal entities to Wright, totaling ${money(total)}. The largest is ${entities[0].name} at ${money(entities[0].amount)}.`);

    track.append("g")
      .attr("class", "grid")
      .selectAll("line")
      .data(y.ticks(7).filter(Boolean))
      .join("line")
      .attr("x1", margin.left)
      .attr("x2", width - margin.right)
      .attr("y1", d => y(d))
      .attr("y2", d => y(d));

    const column = track.append("g").selectAll("g")
      .data(entities)
      .join("g")
      .attr("class", "column")
      .attr("transform", (d, i) => `translate(${margin.left + (i + 0.5) * PITCH},0)`);

    column.append("path")
      .attr("class", "bar")
      .attr("d", d => roundedTop(-BAR_WIDTH / 2, BAR_WIDTH, y(d.amount), baseline));

    column.append("text")
      .attr("class", "value")
      .attr("y", d => y(d.amount) - 8)
      .text(d => money(d.amount));

    column.append("text")
      .attr("class", "name")
      .attr("y", baseline + 20)
      .each(function(d) { wrapName(this, d.name); });

    track.append("line")
      .attr("class", "baseline")
      .attr("x1", margin.left)
      .attr("x2", width - margin.right)
      .attr("y1", baseline)
      .attr("y2", baseline);

    // The axis sits on its own surface above the moving chart, so it stays put while the columns pass behind it.
    axis.selectAll("*").remove();
    axis.attr("width", margin.left).attr("height", height);
    axis.append("g")
      .attr("class", "axis")
      .attr("transform", `translate(${margin.left - 4},0)`)
      .call(d3.axisLeft(y).ticks(7).tickSize(0).tickPadding(4).tickFormat(axisMoney));

    travel = Math.max(0, width - stageWidth);
    columns = column;
    shown = null;
    buildTimeline(stageWidth);
    update();
  }

  // Lays out the scroll as a list of segments: pans, where scrolling moves the chart sideways, and holds, where the chart
  // stays put while one card is shown.
  function buildTimeline(stageWidth) {
    const screen = pin.clientHeight;
    const [left, right] = stageWidth >= CARD_SIDE_MIN ? [margin.left, stageWidth - CARD_SPACE] : [margin.left, stageWidth];
    const clamp = x => Math.min(travel, Math.max(0, x));
    const inView = (indices, x) => indices.every(i => margin.left + i * PITCH - x >= left && margin.left + (i + 1) * PITCH - x <= right);

    // Center each stop's columns in the space beside the cards, unless they are already in view from the last stop.
    let last = 0;
    STOPS.forEach(stop => {
      if (!stop.columns.length) return;
      const middle = margin.left + (d3.min(stop.columns) + d3.max(stop.columns) + 1) / 2 * PITCH;
      stop.x = inView(stop.columns, last) ? last : clamp(middle - (left + right) / 2);
      last = stop.x;
    });
    STOPS.forEach((stop, i) => {
      if (stop.columns.length) return;
      const before = i > 0 ? STOPS[i - 1].x : 0;
      const after = STOPS.slice(i + 1).find(s => s.columns.length)?.x ?? before;
      stop.x = (before + after) / 2;
    });

    timeline = [];
    let at = 0;
    let x = 0;
    const pan = (to, minimum) => {
      const length = Math.max(minimum, Math.abs(to - x));
      timeline.push({ type: "pan", start: at, end: at + length, from: x, to });
      at += length;
      x = to;
    };
    STOPS.forEach((stop, stopIndex) => {
      pan(stop.x, screen * MIN_PAN);
      stop.cards.forEach((text, cardIndex) => {
        timeline.push({ type: "hold", start: at, end: at + screen * HOLD, x, stopIndex, cardIndex });
        at += screen * HOLD;
      });
    });
    pan(travel, screen * MIN_PAN);
    scroller.style.height = `${screen + at}px`;
  }

  function show(stopIndex, cardIndex) {
    const key = stopIndex === null ? null : `${stopIndex}-${cardIndex}`;
    if (key === shown) return;
    shown = key;
    const highlighted = stopIndex === null ? [] : STOPS[stopIndex].columns;
    cards.classed("active", d => d.stopIndex === stopIndex && d.cardIndex === cardIndex);
    columns
      .classed("focus", (d, i) => highlighted.includes(i))
      .classed("dim", (d, i) => highlighted.length > 0 && !highlighted.includes(i));
  }

  function update() {
    if (!timeline.length) return;
    const scrolled = Math.max(0, -scroller.getBoundingClientRect().top);
    const segment = timeline.find(s => scrolled < s.end) ?? timeline[timeline.length - 1];
    if (segment.type === "pan") {
      const progress = Math.min(1, (scrolled - segment.start) / (segment.end - segment.start));
      track.style("transform", `translateX(${-(segment.from + (segment.to - segment.from) * progress)}px)`);
      show(null, null);
    } else {
      track.style("transform", `translateX(${-segment.x}px)`);
      show(segment.stopIndex, segment.cardIndex);
    }
  }

  let scheduled = false;
  window.addEventListener("scroll", () => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      update();
    });
  }, { passive: true });

  let drawnSize = "";
  new ResizeObserver(() => {
    const size = `${stage.clientWidth}x${stage.clientHeight}`;
    if (stage.clientWidth && size !== drawnSize) {
      drawnSize = size;
      draw();
    }
  }).observe(stage);

  // Names are measured to wrap them, so measure again once Roboto has loaded.
  document.fonts.load("12px Roboto").then(() => {
    if (drawnSize) draw();
  });
</script>
</body>
</html>
